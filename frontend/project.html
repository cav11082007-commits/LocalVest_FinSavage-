<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết dự án - LocalVest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .detail-layout { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start; }
    @media (max-width: 860px) { .detail-layout { grid-template-columns: 1fr; } }
    .detail-cover { height: 220px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 64px; color: #fff; margin-bottom: 20px; }
    .donate-card { position: sticky; top: 84px; }
    .creator-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: #F8FAFC; }
  </style>
</head>
<body>
<div class="page-shell">
  <div id="navbar-root"></div>
  <main class="page-main">
    <div class="container" id="project-root">Đang tải dự án...</div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  LV.requireLogin();
  LV.renderNavbar('home');

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get('id');
    const root = document.getElementById('project-root');

    if (!projectId) {
      root.innerHTML = `<div class="card card-pad text-center">
        <p class="text-muted">Không tìm thấy dự án này.</p>
        <a class="btn btn-primary mt-16" href="home.html">Về trang khám phá</a>
      </div>`;
      return;
    }

    const project = await LV.getCampaignDetail(projectId);

    if (!project) {
      root.innerHTML = `<div class="card card-pad text-center">
        <p class="text-muted">Không tìm thấy dự án này.</p>
        <a class="btn btn-primary mt-16" href="home.html">Về trang khám phá</a>
      </div>`;
    } else {
      const pct = Math.min(100, Math.round((project.raised_amount / project.target_amount) * 100));
      const ledger = await LV.getLedger(project.id);
      const backers = ledger.filter((e) => e.type === 'in').length;

      const milestoneHtml = project.milestones.map((m, i) => {
        const statusMap = {
          released: { cls: 'done', label: 'Đã giải ngân', dot: '✓' },
          pending: { cls: 'active', label: 'Chờ giải ngân', dot: i + 1 },
          locked: { cls: '', label: 'Đang khoá', dot: i + 1 },
        };
        const s = statusMap[m.status] || statusMap.locked;
        return `
          <div class="timeline-item ${s.cls}" onclick="this.classList.toggle('open')">
            <div class="timeline-dot">${s.dot}</div>
            <div class="timeline-card">
              <div class="timeline-head">
                <div class="timeline-title">${m.name}</div>
                <span class="badge ${m.status === 'released' ? 'badge-success' : m.status === 'pending' ? 'badge-warning' : 'badge-neutral'}">${s.label}</span>
              </div>
              <div class="timeline-amount">${LV.formatVND(m.target_amount || m.amount || 0)}</div>
              <div class="timeline-detail">${m.description || m.desc || ''}</div>
            </div>
          </div>`;
      }).join('');

      root.innerHTML = `
        <a href="home.html" class="text-sm text-muted">← Quay lại khám phá</a>
        <div class="detail-cover ${project.cover}" style="margin-top:16px;">${project.icon}</div>

        <div class="detail-layout">
          <div>
            ${project.status === 'pending_review' ? `<div class="banner banner-warning">⚠ Dự án này đang chờ đội ngũ Admin phê duyệt trước khi gọi vốn.</div>` : ''}
            
            <!-- AI AUDIT REPORT (MINH BẠCH) - UNIFIED TOP BANNER -->
            ${(() => {
              // Nếu không có cờ rủi ro, mặc định coi là 0% (An toàn)
              let score = project.fraudFlag ? (project.fraudFlag.score || 0) : 0;
              let reasons = project.fraudFlag ? (project.fraudFlag.reasons || [project.fraudFlag.reason || 'Không phát hiện bất thường']) : ['Dòng tiền minh bạch, lịch sử quyên góp tự nhiên.', 'Xác thực KYC chủ dự án khớp với thông tin ngân hàng.'];
              
              let borderColor = score <= 30 ? '#10b981' : (score <= 49 ? '#f59e0b' : '#ef4444');
              let bgColor = score <= 30 ? 'rgba(16, 185, 129, 0.08)' : (score <= 49 ? 'rgba(245, 158, 11, 0.08)' : 'rgba(239, 68, 68, 0.08)');
              let icon = score <= 30 ? '🟢' : (score <= 49 ? '🟡' : '🔴');
              let statusText = score <= 30 ? 'An toàn' : (score <= 49 ? 'Cần xem xét' : 'Rủi ro cao');
              let actionText = score <= 30 ? 'Hệ thống đánh giá dự án đạt chuẩn minh bạch.' : 'Đội ngũ LocalVest đang tiến hành xác minh thêm.';
              
              // Sử dụng màu chữ đậm (Dark text) cho nền sáng (Light mode)
              let titleColor = score <= 30 ? '#047857' : (score <= 49 ? '#b45309' : '#b91c1c');
              let textColor = '#334155'; // Slate 700
              let subTextColor = '#475569'; // Slate 600
              
              return `
              <div class="card mb-16" style="background:${bgColor}; border:1px solid ${borderColor}; padding:14px 18px; border-radius:8px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                  <strong style="color:${titleColor}; font-size:15px; display:flex; align-items:center; gap:6px;">
                     Báo cáo AI Audit Minh bạch
                  </strong>
                  <span class="badge" style="background:#fff; color:${titleColor}; border:1px solid ${borderColor}; font-size:12px; font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,0.05);">
                    ${icon} ${score}% (${statusText})
                  </span>
                </div>
                <p style="margin:0 0 8px 0; font-size:14px; font-weight:500; color:${textColor};">${actionText}</p>
                <ul style="font-size:13.5px; color:${subTextColor}; padding-left:18px; margin:0; line-height:1.6;">
                  ${reasons.map(r => `<li style="margin-bottom:4px;">${r}</li>`).join('')}
                </ul>
              </div>
              `;
            })()}

            <div class="flex items-center gap-8 mb-16" style="flex-wrap:wrap;">
              <span class="badge badge-primary">${project.category}</span>
              <span class="text-sm text-muted">📍 ${project.location_name || project.location || 'Không rõ'}</span>
            </div>
            <h1 class="page-title" style="margin-bottom:16px;">${project.name}</h1>

            <div class="creator-row mb-16">
              <div class="nav-avatar">${LV.initials(project.creator_name || project.creatorName)}</div>
              <div style="flex:1;">
                <div style="font-weight:600; font-size:14px;">${project.creator_name || project.creatorName}</div>
                <div class="text-sm text-muted">Người sáng lập dự án</div>
              </div>
              ${(project.creator_verified || project.creatorVerified)
                ? `<span class="badge badge-success">✓ Đã xác minh CCCD</span>`
                : `<span class="badge badge-warning">Đang chờ xác minh</span>`}
            </div>

            <div class="card card-pad mb-16">
              <div class="section-title">Giới thiệu dự án</div>
              <p class="text-muted" style="line-height:1.7; margin:0; white-space:pre-wrap;">${project.description}</p>
            </div>

            <div class="card card-pad">
              <div class="section-title">Lộ trình giải ngân theo mốc (Escrow)</div>
              <p class="text-sm text-muted" style="margin-top:-6px;">Vốn được giữ trong tài khoản escrow và chỉ giải ngân từng phần khi dự án đạt các mốc minh bạch bên dưới. Nhấn vào từng mốc để xem chi tiết điều kiện.</p>
              <div class="timeline mt-16">${milestoneHtml}</div>
            </div>
          </div>

          <div class="donate-card card card-pad">
            <div class="project-amount" id="ui-raised" style="font-size:22px;">${LV.formatVND(project.raised_amount)}</div>
            <div class="text-sm text-muted mb-16">đã gọi được trên mục tiêu ${LV.formatVND(project.target_amount)}</div>
            <div class="progress-track"><div class="progress-fill" id="ui-progress" style="width:${pct}%"></div></div>
            <div class="flex justify-between text-sm text-muted mt-8 mb-16">
              <span><span id="ui-pct">${pct}</span>% hoàn thành</span>
              <span><span id="ui-backers">${backers}</span> lượt đóng góp</span>
            </div>
            ${project.status === 'funded' || project.status === 'completed' || project.raised_amount >= project.target_amount ? '<button class="btn btn-primary btn-block" disabled style="background:#64748b; border-color:#64748b; cursor:not-allowed;">Dự án đã đạt đủ quỹ</button>' : `<a class="btn btn-primary btn-block" href="checkout.html?id=${project.id}">Đóng góp ngay</a>`}
            <a class="btn btn-outline btn-block mt-8" href="dashboard.html?id=${project.id}">Xem dòng tiền minh bạch</a>
          </div>
        </div>
      `;
    }

    window.addEventListener('LiveFeedUpdate', async (e) => {
      if (project && e.detail.projectId === project.id) {
        // Fetch updated project data to ensure consistency with backend SSOT
        const p = await LV.getCampaignDetail(project.id);
        if (!p) return;
        
        const raisedEl = document.getElementById('ui-raised');
        const progEl = document.getElementById('ui-progress');
        const pctEl = document.getElementById('ui-pct');
        const backerEl = document.getElementById('ui-backers');
        
        if (raisedEl) raisedEl.innerHTML = LV.formatVND(p.raised_amount);
        
        const newPct = Math.min(100, Math.round((p.raised_amount / p.target_amount) * 100));
        if (progEl) progEl.style.width = newPct + '%';
        if (pctEl) pctEl.innerHTML = newPct;
        
        if (backerEl) {
          const fetchedLedger = await LV.getLedger(project.id);
          const backersCount = fetchedLedger.filter((x) => x.type === 'in').length;
          backerEl.innerHTML = backersCount;
        }
        
        const card = document.querySelector('.donate-card');
        if (card) {
          card.style.transition = 'box-shadow 0.5s ease';
          card.style.boxShadow = '0 0 15px var(--color-primary-tint-10)';
          setTimeout(() => { card.style.boxShadow = 'var(--shadow-sm)'; }, 1500);
        }
      }
    });
  }

  init();
</script>
</body>
</html>
