<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đóng góp - LocalVest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .checkout-wrap { max-width: 520px; margin: 0 auto; }
    .amount-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .amount-opt {
      height: 56px; border: 1px solid var(--color-border-light); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
      color: var(--color-text-dark); background: #fff;
    }
    .amount-opt.selected { border-color: var(--color-primary); background: var(--color-primary-tint-10); color: var(--color-primary); }
    .qr-mock {
      width: 160px; height: 160px; margin: 0 auto 16px; border-radius: var(--radius-md);
      background:
        repeating-linear-gradient(0deg, #1E293B 0 6px, #fff 6px 12px),
        repeating-linear-gradient(90deg, #1E293B 0 6px, transparent 6px 12px);
      background-blend-mode: multiply;
      border: 8px solid #fff; outline: 1px solid var(--color-border);
    }
  </style>
</head>
<body>
<div class="page-shell">
  <div id="navbar-root"></div>
  <main class="page-main">
    <div class="container checkout-wrap" id="checkout-root">Đang tải...</div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  LV.requireLogin();
  LV.renderNavbar('home');

  // ===== Kết nối Backend thật (task 3.2 — Test Realtime WebSocket) =====
  // Nếu id trên URL trùng với một dự án THẬT trên backend (proj_1, proj_2 — xem
  // backend/app/store.py), đóng góp ở đây sẽ gọi POST /api/payments/momo-webhook thật,
  // kích hoạt backend phát sự kiện NEW_TRANSACTION qua WebSocket cho dashboard.html đang
  // mở ở tab khác nhìn thấy ngay lập tức, không cần F5 — đúng kịch bản
  // docs/test_scenarios/05_realtime_websocket_tests.md.
  const API_BASE = 'http://127.0.0.1:8000';

  const MIN_AMOUNT = 20000;
  const params = new URLSearchParams(window.location.search);
  const root = document.getElementById('checkout-root');

  let project = null;
  let isRealProject = false;

  (async function loadProject() {
    const id = params.get('id');
    try {
      const res = await fetch(`${API_BASE}/api/campaigns/${id}`);
      if (res.ok) {
        const { project: real } = await res.json();
        project = real;
        isRealProject = true;
        renderForm();
        return;
      }
    } catch (err) { /* backend không chạy hoặc id không phải dự án thật — rơi về dữ liệu mô phỏng */ }

    project = LV.getProject(id);
    if (!project) {
      root.innerHTML = `<div class="card card-pad text-center">
        <p class="text-muted">Không tìm thấy dự án này.</p>
        <a class="btn btn-primary mt-16" href="home.html">Về trang khám phá</a>
      </div>`;
      return;
    }
    renderForm();
  })();

  function renderForm() {
    root.innerHTML = `
      <a href="project.html?id=${project.id}" class="text-sm text-muted">← Quay lại dự án</a>
      <h1 class="page-title mt-16">Đóng góp cho dự án</h1>
      <p class="page-subtitle">${project.name}</p>

      <div class="card card-pad">
        <div class="field">
          <label>Chọn nhanh số tiền</label>
          <div class="amount-grid" id="amount-grid">
            <div class="amount-opt" data-amount="100000">100.000đ</div>
            <div class="amount-opt" data-amount="200000">200.000đ</div>
            <div class="amount-opt" data-amount="500000">500.000đ</div>
          </div>
        </div>
        <div class="field" id="custom-field">
          <label>Hoặc nhập số tiền khác (VNĐ)</label>
          <input type="number" class="input" id="custom-amount" placeholder="Tối thiểu 20.000đ" min="0" step="1000">
          <div class="error-text">Số tiền đóng góp tối thiểu là 20.000 VNĐ.</div>
        </div>
        <div class="field">
          <label>Tên hiển thị khi đóng góp</label>
          <input type="text" class="input" id="donor-name" value="${(LV.getUser() || {}).name || ''}">
        </div>
        <div class="banner ${isRealProject ? 'banner-warning' : 'banner-info'}">
          ${isRealProject
            ? '🔴 Đây là giao dịch THẬT gửi tới backend — sẽ đẩy realtime qua WebSocket tới Dashboard đang mở ở tab khác.'
            : '💳 Đây là luồng thanh toán mô phỏng (Week 1 MVP) — chưa kết nối cổng thanh toán thật.'}
        </div>
        <button class="btn btn-primary btn-block" id="confirm-btn">Xác nhận đóng góp</button>
      </div>
    `;

    let selectedAmount = null;
    const grid = document.getElementById('amount-grid');
    const customInput = document.getElementById('custom-amount');
    const customField = document.getElementById('custom-field');

    grid.querySelectorAll('.amount-opt').forEach((opt) => {
      opt.addEventListener('click', () => {
        grid.querySelectorAll('.amount-opt').forEach((o) => o.classList.remove('selected'));
        opt.classList.add('selected');
        selectedAmount = Number(opt.dataset.amount);
        customInput.value = '';
        customField.classList.remove('has-error');
      });
    });

    customInput.addEventListener('input', () => {
      grid.querySelectorAll('.amount-opt').forEach((o) => o.classList.remove('selected'));
      selectedAmount = null;
      customField.classList.remove('has-error');
    });

    document.getElementById('confirm-btn').addEventListener('click', () => {
      const amount = selectedAmount || Number(customInput.value || 0);
      if (!amount || amount < MIN_AMOUNT) {
        customField.classList.add('has-error');
        return;
      }
      const donorName = document.getElementById('donor-name').value.trim() || 'Ẩn danh';
      const btn = document.getElementById('confirm-btn');
      btn.disabled = true;
      btn.textContent = 'Đang xử lý thanh toán...';

      if (isRealProject) {
        fetch(`${API_BASE}/api/payments/momo-webhook`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectId: project.id, amount, backerName: donorName }),
        })
          .then((res) => res.json().then((body) => ({ ok: res.ok, body })))
          .then(({ ok, body }) => {
            if (!ok) throw new Error(body.detail || 'Backend từ chối giao dịch');
            completeDonationReal(amount, donorName, body.ledger);
          })
          .catch((err) => {
            btn.disabled = false;
            btn.textContent = 'Xác nhận đóng góp';
            LV.toast('Giao dịch thật thất bại: ' + err.message, 'error');
          });
      } else {
        setTimeout(() => completeDonation(amount, donorName), 900);
      }
    });
  }

  function completeDonationReal(amount, donorName, ledgerEntry) {
    root.innerHTML = `
      <div class="card card-pad text-center">
        <div style="font-size:40px;">🎉</div>
        <h2 style="margin:8px 0 4px;">Cảm ơn bạn đã đóng góp!</h2>
        <p class="text-muted">Bạn vừa đóng góp <strong>${LV.formatVND(amount)}</strong> cho dự án<br>"${LV.esc(project.name)}"</p>

        <div class="banner banner-success mt-16" style="text-align:left;">
          🔴 Giao dịch đã ghi vào backend thật (mã <code>${LV.esc(ledgerEntry.id)}</code>) và vừa phát sự kiện
          <code>NEW_TRANSACTION</code> qua WebSocket. Mở <a href="dashboard.html" target="_blank">Dashboard</a>
          ở tab khác, chọn dự án này trong nhóm "🔴 LIVE" để xem cập nhật tức thời không cần F5.
        </div>

        <div class="card" style="text-align:left; border-color: var(--color-border);">
          <div class="flex justify-between items-center" style="padding:12px 16px; border-bottom:1px solid var(--color-border);">
            <span class="text-sm text-muted">Người đóng góp</span><span style="font-weight:600;">${LV.esc(donorName)}</span>
          </div>
          <div class="flex justify-between items-center" style="padding:12px 16px; border-bottom:1px solid var(--color-border);">
            <span class="text-sm text-muted">Số tiền</span><span style="font-weight:600;">${LV.formatVND(amount)}</span>
          </div>
          <div class="flex justify-between items-center" style="padding:12px 16px;">
            <span class="text-sm text-muted">Trạng thái</span><span class="badge badge-success">Thành công (backend thật)</span>
          </div>
        </div>

        <div class="flex gap-12 mt-24" style="justify-content:center; flex-wrap: wrap;">
          <a class="btn btn-outline" href="home.html">Về trang khám phá</a>
          <a class="btn btn-primary" href="dashboard.html">Xem dòng tiền minh bạch</a>
        </div>
      </div>
    `;
  }

  function completeDonation(amount, donorName) {
    const projects = LV.getProjects();
    const p = projects.find((x) => x.id === project.id);
    p.raised += amount;
    LV.saveProjects(projects);
    const entry = {
      time: new Date().toISOString(),
      amount, type: 'in',
      desc: `+${LV.formatVND(amount)} từ ${donorName}`,
    };
    LV.pushLedger(project.id, entry);

    const ticketId = 'LV-' + Date.now().toString(36).toUpperCase();
    root.innerHTML = `
      <div class="card card-pad text-center">
        <div style="font-size:40px;">🎉</div>
        <h2 style="margin:8px 0 4px;">Cảm ơn bạn đã đóng góp!</h2>
        <p class="text-muted">Bạn vừa đóng góp <strong>${LV.formatVND(amount)}</strong> cho dự án<br>"${p.name}"</p>

        <div class="qr-mock mt-16"></div>
        <div class="text-sm text-muted">Vé điện tử mô phỏng</div>
        <div style="font-weight:700; letter-spacing: 1px; margin: 4px 0 16px;">${ticketId}</div>

        <div class="card" style="text-align:left; border-color: var(--color-border);">
          <div class="flex justify-between items-center" style="padding:12px 16px; border-bottom:1px solid var(--color-border);">
            <span class="text-sm text-muted">Người đóng góp</span><span style="font-weight:600;">${donorName}</span>
          </div>
          <div class="flex justify-between items-center" style="padding:12px 16px; border-bottom:1px solid var(--color-border);">
            <span class="text-sm text-muted">Số tiền</span><span style="font-weight:600;">${LV.formatVND(amount)}</span>
          </div>
          <div class="flex justify-between items-center" style="padding:12px 16px; border-bottom:1px solid var(--color-border);">
            <span class="text-sm text-muted">Thời gian</span><span style="font-weight:600;">${LV.formatDate(new Date().toISOString())}</span>
          </div>
          <div class="flex justify-between items-center" style="padding:12px 16px;">
            <span class="text-sm text-muted">Trạng thái</span><span class="badge badge-success">Thành công (mô phỏng)</span>
          </div>
        </div>

        <div class="flex gap-12 mt-24" style="justify-content:center; flex-wrap: wrap;">
          <a class="btn btn-outline" href="project.html?id=${p.id}">Về trang dự án</a>
          <a class="btn btn-primary" href="dashboard.html?id=${p.id}">Xem dòng tiền minh bạch</a>
        </div>
      </div>
    `;
  }
</script>
</body>
</html>
